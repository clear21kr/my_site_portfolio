<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 GSAP 스크롤트리거</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="smooth-wrapper">
     <div id="smooth-content">
  
  
    <header>상단영역</header>
  <h1 class="title">ScrollTrigger</h1>

  <main id="wrap">
    <div class="box1"><p class="item">박스1</p></div>
  </main>

  </div>
  </div>
  
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollSmoother.min.js"></script>

<script>
  // use a script tag or an external JS file
  document.addEventListener("DOMContentLoaded", (event) => {
  gsap.registerPlugin(ScrollTrigger,ScrollSmoother)
  // gsap code here!
  const smoother = ScrollSmoother.create({
    smooth:2, //부드럽게 스크롤됨(감속 완충시간)

    smoothTouch:0.1 //모바일 터치감속시간
  });
  

  gsap.from(".title",
  {
    y:80,
    opacity:0,
  },
  {
    x:80,
    opacity:0,
    duration:1,
    scrollTrigger:{
      trigger:".title", //트리거 요소
      //markers:true, //마커표시여부
      start:"top 70%", //시작지점(요소, 뷰포트)
                   //start end end start   

      toggleActions:"play none none reverse",
    },
  });
  
  gsap.to(".box1",{
    x:0,
    scrollTrigger:{
      trigger:".box1", //시작기준요소
      start:"top 50px",
      //markers:true,
      endTrigger:"#wrap", //종료기준요소
      end:"bottom bottom", //#wrap아래 뷰포트아래
      //end:"+=1000", //1000px만큼 내릴동안 고정유지
      pin:true, //스크롤을 고정시킴
    }
  });

   const tl = gsap.timeline({
    scrollTrigger:{
      trigger:"#wrap",
      start:"top top",
      end:"bottom bottom",
      markers:true,
      scrub:3 //타임라인과 동기화 
    }
   });
   //초기세팅
   gsap.set(".item",{scale:0});

   tl.to(".item",{scale:1})
   .to(".item",{rotation:360})
   .to(".item",{width:"50%"})
   .to(".item",{width:"90%"});

});

</script>




</body>
</html>
