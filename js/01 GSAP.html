<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 GSAP</title>
    <style>
      .box{width:200px; height:200px;
        background:#369;
        display:flex; justify-content:center;
        align-items:center;}

      .box span{font:50px/1 "궁서";
        font-weight:bold; color:#fff;}
        
      hr{margin:50px 0;}  
    
      .box2{background:#e49;}
      .box3{background:#963;}
      .box4{background:#e49;}
      .box5{background:#963;}
       
    </style>
</head>
<body>
    <div class="box box1"><span>to모션</span></div>
    <div class="box box1"><span>to모션</span></div>
    <div class="box box1"><span>to모션</span></div>

    <hr>

    <div class="box box2"><span>from모션</span></div>

    <hr>

    <div class="box box3"><span>fromTo</span></div>

    <hr>

    <div class="box box4"><span>박스1</span></div>
    <div class="box box5"><span>박스2</span></div>


    
    
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script>
      // use a script tag or an external JS file
     document.addEventListener("DOMContentLoaded", (event) => {
     // gsap code here!
     gsap.to(".box1",{
        x:300, //수평이동, y:수직이동
        rotation:360, //회전
        scale:0.5, //크기배율
        duration:5, //지속시간
        delay:2, //대기시간
        repeat:3, //반복횟수(-1:무한반복)
        yoyo:true, //왕복모션
        stagger:0.5 //순차적 딜레이
     });
 
    gsap.from(".box2",{
        x:300,
        opacity:0.1,
        duration:3,
        repeat:3
    });

    gsap.fromTo(".box3",
      {scale:0.1,opacity:0},
      {scale:1.2,opacity:1,duration:1,repeat:-1,
        yoyo:true}
    );

      gsap.to(".box4",{
        x:400, duration:3, repeat:-1
      });
      gsap.to(".box5",{
        x:400, duration:3, repeat:-1,
        ease: "bounce.in", //속도변화
      });

    });

</script>
</body>
</html>
