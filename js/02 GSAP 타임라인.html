<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02 GSAP 타임라인</title>
    <style>
      .box{width:100px; height:100px;
        background:#358; color:#fff;
        font-size:50px; text-align:center;
        line-height:100px;}
      hr{margin:20px 0;}  
    </style>
</head>
<body>
  <div class="box b1">b1</div>
  <hr>
  <div class="box b2">b2</div>
  <hr>
  <div class="box b3">b3</div>
  <hr>
  <div class="box b4">b4</div>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

  <script>
    // use a script tag or an external JS file
    document.addEventListener("DOMContentLoaded", (event) => {
    // gsap code here!
    const tl = gsap.timeline({
      repeat:-1,
      repeatDelay:1, //반복사이 대기시간
      yoyo:true    
    });

    //tl.to().to().to()

    tl.to(".b1",{x:300, duration:2})
    .to(".b1",{y:100, duration:1})
    .to(".b1",{x:0, duration:2});
    
    const abc = gsap.timeline();

    abc
    .to(".b2",{x:300, duration:2})
    .to(".b3",{x:300, duration:2},1)
    .to(".b4",{x:300, duration:2},"<-0.2");

    /*
       숫자 : 절대 시간 지점
       "+=1" : 직전 모션이 끝난 후 1초대기
       "-=1" : 직전 모션이 끝나기 1초 전
       "<" : 동시시작
       ">" : 끝나고 난 후(기본값)
       "<0.2" : 직전 모션이 시작 후 0.2뒤
       "<-0.2" : 직전 모션이 시작하기 0.2전
    */   

});

</script>
</body>
</html>
